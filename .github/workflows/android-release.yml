name: Android release

# Builds the signed Play Store bundle (AAB) for the Metal ERP Trusted Web Activity.
# The app is only a shell around https://metal.fleekfinance.in (see twa/twa-manifest.json), so a
# web deploy updates it instantly; this workflow is needed only for the first release and when
# twa-manifest.json changes (icons, name, colours, package).
#
#   Push a tag  android-vX.Y.Z   (or run it by hand)  -> AAB + APK as a build artifact, and,
#   when PLAY_SERVICE_ACCOUNT_JSON is set, uploaded to the Play "internal" track.
#
# One-time setup is a single script, run on your machine (needs the GitHub CLI, logged in):
#     powershell -ExecutionPolicy Bypass -File twa/bootstrap.ps1 [-PlayServiceAccountJson C:/path/key.json]
# It makes the upload keystore, creates the "android-release" environment (you as reviewer, tags
# android-v* only), loads every secret below, and writes assetlinks.json with the upload key.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON (optional)
#
# After the Play upload this workflow reads Play's own signing certificate from the Publishing API and
# opens a PR that puts it (plus the upload key) into assetlinks.json. Merge it and the web deploy makes
# the address bar disappear. Still manual, because Google gives no API for them: creating the app in Play
# Console, and creating the service account (Play Console > Setup > API access).

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name X.Y.Z"
        required: true
        default: "1.0.0"

permissions:
  contents: write       # push the assetlinks branch
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: android-release
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          ver="${{ github.event.inputs.version }}"
          [ -n "$ver" ] || ver="${GITHUB_REF_NAME#android-v}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z, got $ver"; exit 1; }
          # Play needs a strictly increasing integer; the run number always increases.
          echo "name=$ver" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Bubblewrap
        run: |
          npm i -g @bubblewrap/cli@1.22.2
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Build
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore
          jq --arg n "${{ steps.ver.outputs.name }}" --argjson c ${{ steps.ver.outputs.code }} \
             '.appVersion=$n | .appVersionCode=$c' twa-manifest.json > t.json && mv t.json twa-manifest.json
          bubblewrap build --skipPwaValidation
          keytool -list -v -keystore android.keystore -alias metalerp \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep 'SHA256:' | tee upload-key-sha256.txt

      - name: Check assetlinks
        # Warning only: the Play fingerprint exists only after the first upload.
        continue-on-error: true
        run: |
          pkg=$(jq -r .packageId twa/twa-manifest.json)
          curl -fsS https://metal.fleekfinance.in/.well-known/assetlinks.json | grep -q "$pkg" \
            || { echo "::warning::assetlinks.json on the live site does not list $pkg yet (see setup step 3)"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metalerp-android-${{ steps.ver.outputs.name }}
          path: |
            twa/app-release-bundle.aab
            twa/app-release-signed.apk
            twa/upload-key-sha256.txt

      - name: Upload to Play (internal track)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.fleekfinance.metalerp
          releaseFiles: twa/app-release-bundle.aab
          track: internal

      - name: Sync assetlinks with Play's signing key (opens a PR)
        # Needs the Play upload to have happened and "Allow GitHub Actions to create pull requests" on.
        if: env.PLAY_JSON != ''
        continue-on-error: true
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          upload_fp=$(grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' twa/upload-key-sha256.txt | head -1)
          node twa/play-fingerprint.mjs "${{ steps.ver.outputs.code }}" "$upload_fp"
          if git diff --quiet -- web/public/.well-known/assetlinks.json; then echo "assetlinks.json already current"; exit 0; fi
          branch="android/assetlinks-${{ steps.ver.outputs.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add web/public/.well-known/assetlinks.json
          git commit -m "Android: assetlinks.json with the Play signing key (v${{ steps.ver.outputs.name }})"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Android: add Play signing key to assetlinks.json"             --body "Written by the Android release run. Merge, and the web deploy removes the address bar from the installed app."
